name: Business Central -> Supabase Sync

on:
  schedule:
    # Every 2 hours. Adjust to taste — incremental syncs are cheap since
    # they only pull records changed since the last successful run.
    - cron: "58 */2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Sync mode"
        required: false
        default: "incremental"
        type: choice
        options:
          - incremental
          - full
      services:
        # Space-separated service names from config/web_services.json, e.g.
        # "Posted_Sales_Credit_Memo_Lines_Excel". Empty means every service.
        # Pair it with mode=full to backfill ONE service without re-pulling the
        # 6.2M-row general ledger - which is what filled the disk on
        # 2026-08-28. Names are validated below; an unknown one fails the run
        # rather than silently syncing nothing.
        description: "Limit to these services (space-separated; blank = all)"
        required: false
        default: ""
        type: string

# A backfill can outlast the 2-hourly cron. Without this, the next tick starts
# a second sync that races the first on etl_sync_state and, worse, on the
# stored resume_url - two runs saving different next-page links for the same
# service corrupts the resume point. Queue instead of overlapping; never
# cancel a run mid-page.
concurrency:
  group: bc-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # backfills are long; incremental runs finish quickly

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # BEFORE the sync: schema the sync itself depends on. Nothing here may
      # read bc_* data - that belongs in sql/, which runs after. Today it holds
      # the credit-memo lines primary key, which the upsert's ON CONFLICT has
      # to match; applying it afterwards would cost one more failed run.
      - name: Apply sql/pre/ (schema the sync depends on)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_SCHEMA: ${{ vars.SUPABASE_DB_SCHEMA || 'public' }}
          SUPABASE_DB_SSLROOTCERT: ${{ github.workspace }}/prod-ca-2021.crt
          SUPABASE_DB_SSLMODE: verify-full
          PG_LOWERCASE_COLUMNS: ${{ vars.PG_LOWERCASE_COLUMNS || 'false' }}
          SUPABASE_RAW_JSON_EXCLUDE_TABLES: >-
            ${{ vars.SUPABASE_RAW_JSON_EXCLUDE_TABLES || '*' }}
          SUPABASE_DISK_LIMIT_GB: ${{ vars.SUPABASE_DISK_LIMIT_GB || '50' }}
          SUPABASE_DISK_STOP_PCT: ${{ vars.SUPABASE_DISK_STOP_PCT || '85' }}
          # config.py requires these at import time even though no BC call is made.
          BC_CLIENT_ID: ${{ secrets.BC_CLIENT_ID }}
          BC_CLIENT_SECRET: ${{ secrets.BC_CLIENT_SECRET }}
          BC_TENANT_ID: ${{ secrets.BC_TENANT_ID }}
          BC_ENVIRONMENT: ${{ secrets.BC_ENVIRONMENT }}
          BC_COMPANY_ID: ${{ secrets.BC_COMPANY_ID }}
        run: |
          python scripts/apply_sql.py sql/pre

      - name: Run sync
        env:
          BC_CLIENT_ID: ${{ secrets.BC_CLIENT_ID }}
          BC_CLIENT_SECRET: ${{ secrets.BC_CLIENT_SECRET }}
          BC_TENANT_ID: ${{ secrets.BC_TENANT_ID }}
          BC_ENVIRONMENT: ${{ secrets.BC_ENVIRONMENT }}
          BC_COMPANY_ID: ${{ secrets.BC_COMPANY_ID }}
          # Per-service overrides live in config/web_services.json ("max_page_size").
          BC_MAXPAGESIZE: ${{ vars.BC_MAXPAGESIZE || '5000' }}
          # Store the whole connection string as one secret. GitHub-hosted
          # runners have dynamic egress IPs, so if you restrict network
          # access on the Supabase side, use the pooler host rather than an
          # IP allow-list.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_SCHEMA: ${{ vars.SUPABASE_DB_SCHEMA || 'public' }}
          # Supabase's pooler certificate does NOT verify against the OS trust
          # store - only against the CA bundle committed alongside this repo.
          # Without these two, libpq finds no root.crt on the runner and
          # sslmode=require silently degrades to encrypted-but-unverified.
          # If Supabase rotates their CA, replace prod-ca-2021.crt from
          # Dashboard > Project Settings > Database > SSL Configuration.
          SUPABASE_DB_SSLROOTCERT: ${{ github.workspace }}/prod-ca-2021.crt
          SUPABASE_DB_SSLMODE: verify-full
          PG_LOWERCASE_COLUMNS: ${{ vars.PG_LOWERCASE_COLUMNS || 'false' }}
          # _raw_json duplicates every field the typed columns already hold.
          # At ~1KB/row it was 90% of the GL table's on-disk size and drove the
          # database to 6.3GB. Excluded on the two high-volume tables; the
          # small ones keep it as a debugging safety net.
          SUPABASE_RAW_JSON_EXCLUDE_TABLES: >-
            ${{ vars.SUPABASE_RAW_JSON_EXCLUDE_TABLES || '*' }}
          SUPABASE_DISK_LIMIT_GB: ${{ vars.SUPABASE_DISK_LIMIT_GB || '50' }}
          SUPABASE_DISK_STOP_PCT: ${{ vars.SUPABASE_DISK_STOP_PCT || '85' }}
          # Disk alerts. Without these the guard still works, it just logs
          # instead of emailing. Gmail app passwords are disabled on this
          # Workspace, so this is an OAuth client with the gmail.send scope.
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
        run: |
          # One --service flag per name. Unquoted expansion is what splits
          # them, so the names must not contain spaces - they are identifiers
          # from config/web_services.json, and app.py rejects an unknown one.
          args=""
          for s in ${{ github.event.inputs.services }}; do
            args="$args --service $s"
          done
          python app.py --mode ${{ github.event.inputs.mode || 'incremental' }} $args

      # BC does not serve page 300 over OData V4 in this tenant (investigated
      # 2026-09-01/02 - the entity set is absent from both the OData catalogue
      # and $metadata even though the Web Services row is Page/300/Published;
      # see the README). SOAP serves it fine, so it cannot go through app.py's
      # OData service loop and needs its own step. It feeds the Sales
      # Register's GSTN and Ship to Name columns, which go stale silently
      # without it - the register keeps emitting plausible values either way.
      #
      # Runs AFTER the main sync on purpose: a SOAP outage must not stop the
      # core data from syncing. `if: always()` so it still runs when the sync
      # step fails, and its own failure is still reported.
      #
      # This is the supported route for this table, not a stopgap. If BC ever
      # exposes page 300 over OData, enable Ship_to_Address_Excel in
      # config/web_services.json and delete this step and the script.
      - name: Load ship-to addresses (SOAP)
        if: always()
        env:
          BC_CLIENT_ID: ${{ secrets.BC_CLIENT_ID }}
          BC_CLIENT_SECRET: ${{ secrets.BC_CLIENT_SECRET }}
          BC_TENANT_ID: ${{ secrets.BC_TENANT_ID }}
          BC_ENVIRONMENT: ${{ secrets.BC_ENVIRONMENT }}
          BC_COMPANY_ID: ${{ secrets.BC_COMPANY_ID }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_SCHEMA: ${{ vars.SUPABASE_DB_SCHEMA || 'public' }}
          SUPABASE_DB_SSLROOTCERT: ${{ github.workspace }}/prod-ca-2021.crt
          SUPABASE_DB_SSLMODE: verify-full
          PG_LOWERCASE_COLUMNS: ${{ vars.PG_LOWERCASE_COLUMNS || 'false' }}
          SUPABASE_RAW_JSON_EXCLUDE_TABLES: >-
            ${{ vars.SUPABASE_RAW_JSON_EXCLUDE_TABLES || '*' }}
          SUPABASE_DISK_LIMIT_GB: ${{ vars.SUPABASE_DISK_LIMIT_GB || '50' }}
          SUPABASE_DISK_STOP_PCT: ${{ vars.SUPABASE_DISK_STOP_PCT || '85' }}
        run: |
          python scripts/load_ship_to_address_soap.py

      # Keeps the deployed view / state lookup / indexes equal to what is in
      # sql/. Without it they exist only because somebody ran them by hand, and
      # editing sql/02_*.sql leaves the database serving the old definition
      # silently. Every file is idempotent, so this is a no-op when unchanged.
      #
      # AFTER the sync on purpose: the view selects from the bc_* tables, so on
      # a fresh database they must exist before it can be created.
      - name: Apply sql/ (view, lookups, indexes)
        if: always()
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_SCHEMA: ${{ vars.SUPABASE_DB_SCHEMA || 'public' }}
          SUPABASE_DB_SSLROOTCERT: ${{ github.workspace }}/prod-ca-2021.crt
          SUPABASE_DB_SSLMODE: verify-full
          PG_LOWERCASE_COLUMNS: ${{ vars.PG_LOWERCASE_COLUMNS || 'false' }}
          SUPABASE_RAW_JSON_EXCLUDE_TABLES: >-
            ${{ vars.SUPABASE_RAW_JSON_EXCLUDE_TABLES || '*' }}
          SUPABASE_DISK_LIMIT_GB: ${{ vars.SUPABASE_DISK_LIMIT_GB || '50' }}
          SUPABASE_DISK_STOP_PCT: ${{ vars.SUPABASE_DISK_STOP_PCT || '85' }}
          # config.py requires these at import time even though no BC call is made.
          BC_CLIENT_ID: ${{ secrets.BC_CLIENT_ID }}
          BC_CLIENT_SECRET: ${{ secrets.BC_CLIENT_SECRET }}
          BC_TENANT_ID: ${{ secrets.BC_TENANT_ID }}
          BC_ENVIRONMENT: ${{ secrets.BC_ENVIRONMENT }}
          BC_COMPANY_ID: ${{ secrets.BC_COMPANY_ID }}
        run: |
          python scripts/apply_sql.py

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: bc-sync-logs
          path: logs/
          retention-days: 14
