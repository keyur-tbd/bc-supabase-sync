name: Order-to-cash bridge refresh

# Rebuilds the o2c_* materialized views (PO -> invoice -> GRN -> credit memo) that Birbal reads as
# warehouse.o2c_bridge / o2c_invoices / o2c_credit_memos / o2c_grn_lines. The views are defined in o2c/
# and applied by hand (see o2c/README.md); this workflow only refreshes them.
#
# NOT SCHEDULED HERE ANY MORE (2026-09-11). The twice-daily beat runs on the database's own clock,
# pg_cron, at 09:00 and 14:00 IST -- see o2c/pg_cron_schedule.sql. GitHub started this workflow's
# scheduled runs 4-5 hours late every day (the 09:00 run at 13:44-13:50 IST, the 18:00 one at
# 22:06-22:19), while a manual run starts within seconds. This workflow stays for exactly that: run it
# by hand from the Actions tab after a GRN backfill, or to refresh between beats.
# select public.o2c_refresh() takes 12-22 minutes; the views with a unique index refresh CONCURRENTLY,
# so Birbal's queries are not blocked while it runs.

on:
  workflow_dispatch:

concurrency:
  group: o2c-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository (for the Supabase root certificate)
        uses: actions/checkout@v4

      - name: Refresh the bridge
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ github.workspace }}/prod-ca-2021.crt
          PGCONNECT_TIMEOUT: "30"
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 \
            -c "set statement_timeout = '1800000'" \
            -c "select public.o2c_refresh()" \
            -c "select (select max(invoice_date) from public.o2c_invoice_hdr) as bridge_max_invoice_date, (select count(*) from public.o2c_bridge) as bridge_lines"
